# Linux: docker compose up
# Docker Desktop (Mac/Windows): docker compose -f docker-compose.yml -f docker-compose.desktop.yml up
services:
  asterisk:
    build: docker/asterisk
    network_mode: host
    env_file: .env
    volumes:
      - ./docker/asterisk/etc:/config:ro
      - ./recordings:/recordings
    restart: unless-stopped

  bridge:
    image: node:22-bookworm-slim
    network_mode: host
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - .:/app
      - bridge_node_modules:/app/node_modules
    restart: unless-stopped

  # Postgres สำหรับ calls/turns/tickets/analytics (P0) — bridge (host network) ต่อผ่าน 127.0.0.1
  # ถ้าไม่ตั้ง DATABASE_URL ใน .env ฝั่ง bridge จะข้าม DB ไปใช้โปรไฟล์ในโค้ด + log JSONL
  postgres:
    # ต้องมี pgvector สำหรับ RAG (P1) — image นี้ base เป็น postgres 16
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aileo}
      # default นี้เป็น placeholder สำหรับ dev เท่านั้น — production ต้องตั้ง POSTGRES_PASSWORD ใน .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_dotenv}
      POSTGRES_DB: ${POSTGRES_DB:-aileo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aileo} -d ${POSTGRES_DB:-aileo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Console (Next.js) — เรียก API ผ่าน proxy /api ไปที่ bridge บน 127.0.0.1:${API_PORT}
  # เข้าถึงจากภายนอกให้วาง reverse proxy ไว้หน้า service นี้
  console:
    image: node:22-bookworm-slim
    network_mode: host
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run build && npx next start -p $${CONSOLE_PORT:-3000}"
    environment:
      API_URL: http://127.0.0.1:${API_PORT:-8090}
      CONSOLE_PORT: ${CONSOLE_PORT:-3000}
      NEXT_PUBLIC_TENANT: ${TENANT_SLUG:-aileo}
    volumes:
      - ./console:/app
      - console_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  bridge_node_modules:
  console_node_modules:
  pgdata:
