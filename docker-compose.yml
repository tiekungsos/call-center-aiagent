# Linux: docker compose up
# Docker Desktop (Mac/Windows): docker compose -f docker-compose.yml -f docker-compose.desktop.yml up
services:
  asterisk:
    build: docker/asterisk
    network_mode: host
    env_file: .env
    volumes:
      - ./docker/asterisk/etc:/config:ro
      - ./recordings:/recordings
    restart: unless-stopped

  bridge:
    image: node:22-bookworm-slim
    network_mode: host
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - .:/app
      - bridge_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  bridge_node_modules:
